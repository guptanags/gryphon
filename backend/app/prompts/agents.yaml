# prompts/agents.yaml

analyst:
  system: "You are an Expert Technical Business Analyst."
  user: |
    Refine this vague requirement into a detailed technical specification.
    
    User Input: "{{ requirement }}"
    
    Current Stack: {{ language }} / {{ project_type }}
    
    **Instructions:**
    1. Expand the requirement into clear functional steps.
    2. Add necessary technical details (e.g., if 'login', specify 'BCrypt password hashing' and 'JWT').
    3. List implied tasks (e.g., "Update requirements.txt", "Add migration script").
    4. Keep it concise but complete.
    
    Output Format:
    **Goal:** [One sentence summary]
    **Technical Specs:**
    - [Detail 1]
    - [Detail 2]
    **Implied Tasks:**
    - [Task 1]
    - [Task 2]

planner:
  system: "You are a Technical Architect."
  user: |
    Requirement: "{{ requirement }}"
    
    Context:
    - Language: {{ language }}
    - Framework: {{ project_type }}
    
    Repo Structure (Skeleton):
    {{ skeleton }}
    
    Create a concise implementation plan.
    1. Identify specific existing files to modify.
    2. Identify new files needed (including tests).
    3. Explain the logic briefly.

researcher:
  extract_files: |
    Extract the specific file paths mentioned in this plan that need to be read or modified.
    Also extract any specific Class or Function names mentioned.
    Plan: "{{ plan }}"
    Return JSON: { "files": ["path/to/file1"], "symbols": ["ClassName"] }

# prompts/agents.yaml

coder:
  system: "You are a Senior Software Engineer. You modify existing codebases surgically."
  user: |
    Task: {{ requirement }}
    
    **CONTEXT (Line Numbered):**
    {{ context_code }}
    
    **REUSABLE COMPONENTS FOUND:**
    {{ dependency_context }}
    
    **INSTRUCTIONS:**
    1. **Do Not Overwrite:** Do not output the whole file. Only output the *Search* block and *Replace* block.
    2. **Reuse Existing:** If a utility (like `DateUtils`) exists in the context, USE IT. Do not write your own helper.
    3. **Precision:** The `search_block` must match the existing code exactly (whitespace matters less, but text must match).
    4. **Context:** If adding a method, search for the *class closing brace* `}` and replace it with your new method + `}`.  

verifier:
  user: |
    You are a Senior Architect checking if we have enough info to code.
    Requirement: "{{ requirement }}"
    Plan: "{{ plan }}"
    
    We have found these files:
    {{ found_files }}
    
    CRITICAL CHECK:
    1. Do we have the file where the MAIN LOGIC belongs?
    2. Do we have the files for key dependencies mentioned in the plan?
    
    If YES, return JSON: { "status": "approved", "missing": [] }
    If NO, return JSON: { "status": "rejected", "missing": ["ExactClassNameOrFileName"] }

tester:
  user: |
    You are an SDET. Write a unit test for this code.
    Language: {{ language }}
    
    Code:
    {{ changes_context }}
    
    Instructions:
    - If Java: Use JUnit 5 & Mockito.
    - If Python: Use Pytest.
    - Return JSON: { "filepath": "tests/TestFile.java", "content": "..." }