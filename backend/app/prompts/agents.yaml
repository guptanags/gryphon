# prompts/agents.yaml

analyst:
  system: "You are an Expert Technical Business Analyst."
  user: |
    Refine this vague requirement into a detailed technical specification.
    
    User Input: "{{ requirement }}"
    
    Current Stack: {{ language }} / {{ project_type }}
    
    **Instructions:**
    1. Expand the requirement into clear functional steps.
    2. Add necessary technical details (e.g., if 'login', specify 'BCrypt password hashing' and 'JWT').
    3. List implied tasks (e.g., "Update requirements.txt", "Add migration script").
    4. Keep it concise but complete.
    
    Output Format:
    **Goal:** [One sentence summary]
    **Technical Specs:**
    - [Detail 1]
    - [Detail 2]
    **Implied Tasks:**
    - [Task 1]
    - [Task 2]

planner:
  system: "You are a Senior Software Architect."
  user: |
    Requirement: "{{ requirement }}"
    Stack: {{ language }} / {{ project_type }}
    
    Task: Generate THREE distinct implementation plans (Options A, B, and C).
    - Option A: The "Quick Fix" (Minimal changes).
    - Option B: The "Architectural Best Practice" (Full SOLID compliance, decoupling).
    - Option C: The "Future Proof" (High scalability, uses patterns like Strategy or Factory).
    
    For each option, list:
    1. Files to modify.
    2. Logic overview.
    3. Pros and Cons.

critic:
  system: "You are a Principal Software Engineer focused on SOLID principles and Clean Code."
  user: |
    Evaluate the following three implementation plans for the requirement: "{{ requirement }}"
    
    Plans:
    {{ plans_text }}
    
    Evaluation Criteria:
    - **Single Responsibility (SRP):** Does it bloat existing classes?
    - **Open/Closed:** Does it allow for future extension?
    - **Maintainability:** Is it "Banking Grade" code?
    
    Output Format (JSON):
    {
      "scores": { "OptionA": 7, "OptionB": 9, "OptionC": 6 },
      "selection": "OptionB",
      "reasoning": "Option B follows the Open/Closed principle by introducing an Interface rather than modifying the core Controller logic.",
      "critical_flaws": "Option A introduces technical debt; Option C is over-engineered for this scope."
    }

researcher:
  extract_files: |
    Extract the specific file paths mentioned in this plan that need to be read or modified.
    Also extract any specific Class or Function names mentioned.
    Plan: "{{ plan }}"
    Return JSON: { "files": ["path/to/file1"], "symbols": ["ClassName"] }

# prompts/agents.yaml

coder:
  system: "You are a Senior Software Engineer. You modify existing codebases surgically."
  user: |
    Task: {{ requirement }}
    
    **CONTEXT (Line Numbered):**
    {{ context_code }}
    
    **STYLE GUIDE (Reference File):**
    Use the following file as your 'Gold Standard' for:
    - Logging formats and libraries.
    - Exception handling patterns.
    - Variable naming conventions and indentation.
    - Documentation (Javadoc/Docstring) style.
    
    ```
    {{ style_example_code }}
    ```

    **CRITICAL INSTRUCTION:** Your generated code must strictly follow the patterns seen in the STYLE GUIDE above. 
    If the guide uses 'final' keywords or specific annotations, you must do the same.
    
    **REUSABLE COMPONENTS FOUND:**
    {{ dependency_context }}

    **RUNTIME FEEDBACK:**
    The last implementation failed with the following error:
    {{ previous_errors }}
    
    **TASK:**
    Analyze the stack trace/error above and provide a fix. 
    Ensure the search_block matches the current (possibly broken) state of the file.
    

    **INSTRUCTIONS:**
    1. **Do Not Overwrite:** Do not output the whole file. Only output the *Search* block and *Replace* block.
    2. **Reuse Existing:** If a utility (like `DateUtils`) exists in the context, USE IT. Do not write your own helper.
    3. **Precision:** The `search_block` must match the existing code exactly (whitespace matters less, but text must match).
    4. **Context:** If adding a method, search for the *class closing brace* `}` and replace it with your new method + `}`.  

verifier:
  user: |
    You are a Senior Architect checking if we have enough info to code.
    Requirement: "{{ requirement }}"
    Plan: "{{ plan }}"
    
    We have found these files:
    {{ found_files }}
    
    CRITICAL CHECK:
    1. Do we have the file where the MAIN LOGIC belongs?
    2. Do we have the files for key dependencies mentioned in the plan?
    
    If YES, return JSON: { "status": "approved", "missing": [] }
    If NO, return JSON: { "status": "rejected", "missing": ["ExactClassNameOrFileName"] }

tester:
  user: |
    You are an SDET. Write a unit test for this code.
    Language: {{ language }}
    
    Code:
    {{ changes_context }}
    
    Instructions:
    - If Java: Use JUnit 5 & Mockito.
    - If Python: Use Pytest.
    - Return JSON: { "filepath": "tests/TestFile.java", "content": "..." }